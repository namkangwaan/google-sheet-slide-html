<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="วิดีโอแนะนำคอร์ส Google Sheets: เรียนแล้วทำได้จริง สร้างด้วย WebGL">
  <title>วิดีโอแนะนำคอร์ส Google Sheets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23059669'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/video/video.css">
</head>
<body>
  <main class="vp" id="player">
    <div class="vp-stage" id="stage">
      <canvas id="screen" aria-label="วิดีโอแนะนำคอร์ส Google Sheets" role="img"></canvas>
      <p class="vp-caption" id="caption" aria-live="off"></p>

      <button class="vp-start" id="start" type="button" disabled>
        <span class="vp-start-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        <span id="start-label">กำลังโหลดฟอนต์…</span>
      </button>

      <button class="vp-unmute" id="unmute" type="button" hidden>แตะเพื่อเปิดเสียง</button>

      <div class="vp-rec" id="rec-badge" hidden>
        <span class="vp-rec-dot" aria-hidden="true"></span>
        <span id="rec-text">กำลังอัด</span>
        <span class="vp-rec-hint">กด Esc เพื่อยกเลิก</span>
      </div>

      <div class="vp-fallback" id="fallback" hidden>
        <h1>เปิดวิดีโอไม่ได้</h1>
        <p id="fallback-text">เบราว์เซอร์นี้ไม่รองรับ WebGL2 ลองเปิดด้วย Chrome, Edge, Firefox หรือ Safari รุ่นล่าสุด</p>
        <a href="./slides.html">กลับไปหน้าบทเรียน</a>
      </div>

      <div class="vp-controls" id="controls">
        <div class="vp-seek">
          <div class="vp-ticks" id="ticks" aria-hidden="true"></div>
          <input id="seek" type="range" min="0" max="180" step="0.01" value="0" aria-label="ตำแหน่งวิดีโอ">
        </div>
        <div class="vp-bar">
          <button type="button" class="vp-btn" id="btn-play" aria-label="เล่น (Space)" title="เล่น / หยุด (Space)">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button type="button" class="vp-btn" id="btn-prev" aria-label="ฉากก่อนหน้า" title="ฉากก่อนหน้า (←)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button type="button" class="vp-btn" id="btn-next" aria-label="ฉากถัดไป" title="ฉากถัดไป (→)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <span class="vp-time" id="time">0:00 / 3:00</span>
          <span class="vp-scene" id="scene-label"></span>
          <span class="vp-spacer"></span>
          <button type="button" class="vp-btn" id="btn-cc" aria-pressed="true" aria-label="คำบรรยาย" title="คำบรรยาย (C)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1z"/></svg>
          </button>
          <button type="button" class="vp-btn" id="btn-mute" aria-pressed="false" aria-label="ปิดเสียง" title="ปิด / เปิดเสียง (M)">
            <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm18.1 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
          </button>
          <button type="button" class="vp-btn vp-btn-rec" id="btn-record" title="อัดเป็นไฟล์วิดีโอ">
            <span class="vp-rec-dot" aria-hidden="true"></span><span>อัดวิดีโอ</span>
          </button>
          <button type="button" class="vp-btn" id="btn-full" aria-label="เต็มจอ" title="เต็มจอ (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg>
          </button>
          <a class="vp-btn vp-back" href="./slides.html" title="เปิดสไลด์บทเรียน">บทเรียน</a>
        </div>
      </div>
    </div>
    <p class="vp-keys">คีย์ลัด: <kbd>Space</kbd> เล่น/หยุด · <kbd>←</kbd><kbd>→</kbd> ฉาก · <kbd>J</kbd><kbd>L</kbd> ±5 วินาที · <kbd>C</kbd> คำบรรยาย · <kbd>M</kbd> เสียง · <kbd>F</kbd> เต็มจอ</p>
  </main>
  <script type="module" src="./src/video/main.js"></script>
</body>
</html>
